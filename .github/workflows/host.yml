name: host

on:
  push:
    paths: ["host/**", ".github/workflows/host.yml"]
  pull_request:
    paths: ["host/**", ".github/workflows/host.yml"]
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      # The whole point of this matrix is to learn what each platform does —
      # never cancel the others because one failed.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: kestrel-host-linux-x64
            binpath: target/release/kestrel-host
          - os: macos-latest
            artifact: kestrel-host-macos-arm64
            binpath: target/release/kestrel-host
          # QuickJS (libquickjs-sys) does not compile under MSVC — confirmed by
          # this matrix's first run (cutils.c errors). The GNU toolchain is the
          # supported path; revisit if the engine crate ever gains MSVC support.
          - os: windows-latest
            artifact: kestrel-host-windows-x64
            target: x86_64-pc-windows-gnu
            binpath: target/x86_64-pc-windows-gnu/release/kestrel-host.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system deps (webkit2gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Windows GNU toolchain (mingw for QuickJS)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          gcc --version
          if ($LASTEXITCODE -ne 0) { choco install mingw -y; gcc --version }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host

      - name: Build host
        working-directory: host
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --target ${{ matrix.target }}
          else
            cargo build --release
          fi

      - name: Report size
        shell: bash
        working-directory: host
        run: ls -la ${{ matrix.binpath }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: host/${{ matrix.binpath }}
          if-no-files-found: error
