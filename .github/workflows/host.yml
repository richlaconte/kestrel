name: host

on:
  push:
    paths: ["host/**", ".github/workflows/host.yml"]
  pull_request:
    paths: ["host/**", ".github/workflows/host.yml"]
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      # The whole point of this matrix is to learn what each platform does —
      # never cancel the others because one failed.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: kestrel-host-linux-x64
            binpath: target/release/kestrel-host
          - os: macos-latest
            artifact: kestrel-host-macos-arm64
            binpath: target/release/kestrel-host
          # QuickJS (libquickjs-sys) does not compile under MSVC — confirmed by
          # this matrix's first run (cutils.c errors). The GNU toolchain is the
          # supported path; revisit if the engine crate ever gains MSVC support.
          - os: windows-latest
            artifact: kestrel-host-windows-x64
            target: x86_64-pc-windows-gnu
            binpath: target/x86_64-pc-windows-gnu/release/kestrel-host.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system deps (webkit2gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      # A coherent MINGW64 toolchain (gcc + windres + binutils from one suite):
      # QuickJS needs gcc, and tauri-build's icon resource must be compiled by
      # a windres whose output the same suite's linker accepts — the runner's
      # default stray gcc caused "resource.lib: file format not recognized".
      - name: Windows GNU toolchain (MSYS2 MINGW64)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-toolchain
          path-type: inherit
      - name: Put MINGW64 first on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "C:\msys64\mingw64\bin"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
          # v2: cache bust — a target dir cached from the MSVC attempt carried
          # a stale rc.exe-format resource.lib into the GNU link.
          prefix-key: kestrel-v2

      - name: Build host
        working-directory: host
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --target ${{ matrix.target }}
          else
            cargo build --release
          fi

      - name: Report size
        shell: bash
        working-directory: host
        run: ls -la ${{ matrix.binpath }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: host/${{ matrix.binpath }}
          if-no-files-found: error
