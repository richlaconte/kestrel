name: host

on:
  push:
    paths: ["host/**", ".github/workflows/host.yml"]
  pull_request:
    paths: ["host/**", ".github/workflows/host.yml"]
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      # The whole point of this matrix is to learn what each platform does —
      # never cancel the others because one failed.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: kestrel-host-linux-x64
            bin: kestrel-host
          - os: macos-latest
            artifact: kestrel-host-macos-arm64
            bin: kestrel-host
          # Plain MSVC: the engine crate is rquickjs, which supports MSVC.
          # (History: the earlier quick-js engine could not compile under MSVC,
          # and the GNU-toolchain workaround died linking tauri-build's icon
          # resource — the rquickjs migration made both problems disappear.)
          - os: windows-latest
            artifact: kestrel-host-windows-x64
            bin: kestrel-host.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system deps (webkit2gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
          # v3: fresh caches after the rquickjs migration (v2 target dirs
          # carry windows-gnu artifacts).
          prefix-key: kestrel-v3

      - name: Build host
        working-directory: host
        run: cargo build --release

      - name: Report size
        shell: bash
        working-directory: host
        run: ls -la target/release/${{ matrix.bin }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: host/target/release/${{ matrix.bin }}
          if-no-files-found: error
