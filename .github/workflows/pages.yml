name: pages

on:
  push:
    branches: [main]
    # The docs are built from these, so a change to any of them redeploys.
    paths:
      - "site/**"
      - "docs/**"
      - "scripts/docs/**"
      - "packages/kestrel-native/index.d.ts"
      - "packages/kestrel/native/host.d.ts"
      - "packages/kestrel/schema/**"
      - "packages/kestrel/bin/kestrel.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      # The landing page plus the docs, rendered from docs/ and the type definitions.
      - run: npm run docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
