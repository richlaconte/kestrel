name: e2e

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # mksquashfs, for the AppImage packaging test.
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y squashfs-tools
      - run: npm install
      - run: npm test

  smoke:
    name: create → dev → IPC → build (${{ matrix.os }})
    # A GUI left waiting for input (an installer, a dialog) fails the job
    # instead of holding a runner for six hours.
    timeout-minutes: 45
    strategy:
      # Each platform tells us something different; never cancel the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: NSIS (for kestrel build --installer)
        if: runner.os == 'Windows'
        run: |
          if ! command -v makensis >/dev/null && [ ! -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            choco install nsis -y --no-progress
          fi

      - name: System deps (webkit2gtk, xvfb, squashfs-tools)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev xvfb squashfs-tools

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
          prefix-key: kestrel-v3
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build host
        working-directory: host
        run: cargo build --release

      - name: Install workspace
        run: npm install

      # Linux runners have no display; macOS and Windows runners have a
      # desktop session, so the window opens for real.
      - name: Display wrapper
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            echo 'RUN=xvfb-run -a -s "-screen 0 1024x768x24"' >> "$GITHUB_ENV"
          else
            echo 'RUN=' >> "$GITHUB_ENV"
          fi

      - name: E2E IPC contract (async, errors, non-blocking)
        run: eval "$RUN bash scripts/e2e-ipc.sh"

      - name: E2E serving (dev proxy, MIME types, SPA fallback)
        run: eval "$RUN bash scripts/e2e-serve.sh"

      - name: E2E webview storage isolated per app
        run: eval "$RUN bash scripts/e2e-storage.sh"

      - name: E2E webview std-lib (app, window, fs, persistent store)
        run: eval "$RUN bash scripts/e2e-stdlib.sh"

      - name: E2E native hot-reload (bundled imports, reload without restart)
        run: eval "$RUN bash scripts/e2e-reload.sh"

      - name: E2E smoke (react template)
        run: eval "$RUN bash scripts/e2e-smoke.sh react"

      - name: E2E smoke (vanilla template)
        run: eval "$RUN bash scripts/e2e-smoke.sh vanilla"
