name: e2e

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: create → dev → IPC round-trip (Linux, headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System deps (webkit2gtk + xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev xvfb

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build host
        working-directory: host
        run: cargo build --release

      - name: Install workspace
        run: npm install

      - name: E2E smoke (react template)
        run: xvfb-run -a -s "-screen 0 1024x768x24" bash scripts/e2e-smoke.sh react

      - name: E2E smoke (vanilla template)
        run: xvfb-run -a -s "-screen 0 1024x768x24" bash scripts/e2e-smoke.sh vanilla
