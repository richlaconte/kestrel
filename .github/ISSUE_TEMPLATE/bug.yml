name: Bug report
description: Something in Kestrel doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Paste errors as text.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest app or steps that show it. A kestrel.json and a few lines of code are ideal.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kestrel version
      description: "`npx kestrel --version`, or a commit if you build from the repo."
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      multiple: true
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version and architecture
      placeholder: macOS 15.1 arm64, Windows 11 x64, Ubuntu 24.04 x64…
