[package]
name = "kestrel-host"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rquickjs = "0.6"
minreq = "2"
percent-encoding = "2"
dirs = "6"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"

# Already in Tauri's Linux tree (tray-icon): the tray checks for the
# appindicator library before Tauri would abort without it.
[target.'cfg(target_os = "linux")'.dependencies]
dlopen2 = "0.8"

[profile.release]
opt-level = "s"
lto = true
strip = true
